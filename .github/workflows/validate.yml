name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run audit

      - name: Lint
        run: bun run check

      - name: Type-check all workspaces
        run: bun run check-types

      - name: Unit tests
        run: bun run test

      - name: Check conformance coverage
        run: bun --filter '@arsenstorm/olos' conformance:check

      - name: Report conformance coverage
        run: bun --filter '@arsenstorm/olos' conformance:report

      - name: Upload conformance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: olos-conformance
          path: out/conformance/conformance.md
          if-no-files-found: error

  package:
    name: Package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        node: [22, 24]

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun --filter '@arsenstorm/olos' build

      - name: Check generated declarations
        run: bun --filter '@arsenstorm/olos' check-types:dist

      - name: E2E tests
        run: bun --filter '@arsenstorm/olos' test:e2e

      # publint + attw here so an exports-map or declaration break fails the
      # PR instead of the tag-triggered publish run.
      - name: Package checks
        run: bun --filter '@arsenstorm/olos' pack:check

      - name: Package smoke test
        run: bun --filter '@arsenstorm/olos' pack:smoke

      - name: Create package artifact
        if: matrix.node == 24
        run: bun --filter '@arsenstorm/olos' pack:artifact

      - name: Upload package artifact
        if: matrix.node == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: olos-package
          path: out/package-artifacts/*.tgz
          if-no-files-found: error
