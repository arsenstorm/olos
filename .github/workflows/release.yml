name: Release PR

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-pr:
    name: Maintain version PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      # A GitHub App token instead of GITHUB_TOKEN: pushes and pull requests
      # made with GITHUB_TOKEN never trigger other workflows, so the version
      # PR would get no Validate checks and stay blocked.
      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # persist-credentials stays on: changesets/action pushes the version
      # branch with the checked-out git credentials.
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Maintains the "Version Packages" PR. Publishing stays tag-triggered
      # in publish.yml; the step below pushes the tag once the version PR has
      # merged. The npm environment approval is the human release gate.
      - name: Create or update version PR
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: bun run changeset:version
          commit-message: "chore: version @arsenstorm/olos"
          pr-title: "chore: version @arsenstorm/olos"
          # Tags and GitHub releases are owned by the step below and by
          # publish.yml; v2 would otherwise push @arsenstorm/olos@x.y.z tags.
          push-git-tags: false
          create-github-releases: false

      # No pending changesets means the version PR merged (or nothing is
      # queued). Tag olos/package.json's version when no such tag exists. The
      # push uses the App credentials from checkout, so publish.yml runs.
      - name: Tag the released version
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          version="$(jq -r .version olos/package.json)"
          tag="olos-v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; skipping"
            exit 0
          fi
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"
